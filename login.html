<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundIt | Owner Login</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header>
        <div class="brand-group">
            <h1 id="logo">FoundIt<span>!</span></h1>
            <p class="tagline">Because every lost item deserves a way back.</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html" class="active">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add-item.html">Add Item</a>
            <a href="recover.html">Recover</a>
        </nav>
    </header>

    <main>
        <section class="auth-box">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your registered belongings and review recovery reports.</p>
            </div>

            <form id="login-form" action="dashboard.html" method="get" class="auth-form" novalidate>
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" 
                       placeholder="owner@example.com" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" 
                       placeholder="Enter your password" minlength="8" required>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" checked>
                        Remember this browser
                    </label>
                </div>

                <p id="login-feedback" class="form-feedback"></p>

                <button type="submit" class="auth-button">Sign In to Dashboard</button>

                <p class="auth-footer-text">
                    Don't have an account yet? <a href="register.html">Register here</a>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FoundIt. Built to bring belongings back.</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
